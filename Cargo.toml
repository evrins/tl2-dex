[package]
name = "nsh-app-tidbi"
version = "1.0.5"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
serde_json = "1"
base64 = "0.22"
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.4.0", default-features = false }
